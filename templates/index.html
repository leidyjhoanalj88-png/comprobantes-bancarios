<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario</title>
<style>
body {
    background: #0f0f0f;
    color: white;
    font-family: Arial;
    text-align: center;
}

.container {
    margin-top: 30px;
}

input, button {
    margin: 10px;
    padding: 10px;
    width: 80%;
    border-radius: 10px;
    border: none;
}

video {
    width: 90%;
    border-radius: 15px;
    margin-top: 10px;
}

button {
    background: #00ffcc;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>Enviar datos</h2>

    <input type="text" id="nombre" placeholder="Nombre"><br>
    <input type="text" id="telefono" placeholder="Teléfono"><br>

    <video id="video" autoplay playsinline></video><br>

    <button onclick="enviar()">Enviar</button>

    <p id="estado"></p>
</div>

<script>
const video = document.getElementById("video");
const estado = document.getElementById("estado");

// cámara
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
    estado.innerText = "📸 Cámara lista";
})
.catch(() => {
    estado.innerText = "❌ Cámara bloqueada";
});

// info
function getInfo() {
    return {
        resolucion: screen.width + "x" + screen.height,
        idioma: navigator.language,
        useragent: navigator.userAgent,
        touch: ('ontouchstart' in window) ? "Sí" : "No",
        dark: window.matchMedia('(prefers-color-scheme: dark)').matches ? "Sí" : "No",
        online: navigator.onLine ? "Conectado" : "Sin conexión"
    };
}

// enviar
function enviar() {
    const nombre = document.getElementById("nombre").value;
    const telefono = document.getElementById("telefono").value;

    let info = getInfo();

    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(video, 0, 0);

    canvas.toBlob(async (blob) => {
        let fd = new FormData();

        fd.append("nombre", nombre);
        fd.append("telefono", telefono);
        fd.append("foto", blob);

        for (let key in info) {
            fd.append(key, info[key]);
        }

        await fetch("/enviar", {
            method: "POST",
            body: fd
        });

        estado.innerText = "✅ Enviado";
    });
}
</script>

</body>
</html>
